name: Deploy SIGMA to Alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sigma-alwaysdata-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document generation dependencies
        run: pip install python-docx reportlab
      - name: Generate coursework documents and database bundle
        run: python scripts/build-all-draft-coursework.py
      - name: Build credential-free release
        run: |
          python scripts/build-hosting-release.py --output release.zip --runtime-path /home/sigma-elms/sigma-private/runtime.php
      - name: Configure deployment identity
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ALWAYSDATA_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: |
          test -n "$ALWAYSDATA_SSH_KEY"
          test -n "$ALWAYSDATA_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$ALWAYSDATA_SSH_KEY" > ~/.ssh/alwaysdata
          printf '%s\n' "$ALWAYSDATA_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Prune remote releases and inspect disk space
        shell: bash
        run: |
          target="sigma-elms@ssh-sigma-elms.alwaysdata.net"
          opts=(-i ~/.ssh/alwaysdata -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${opts[@]}" "$target" 'python3 -c '\''import shutil, pathlib; h = pathlib.Path("/home/sigma-elms"); w = h / "www"; a = w.resolve().parent if w.exists() else None; [z.unlink() for z in list(h.glob("*.zip")) + list((h / "sigma-releases").glob("*.zip")) if z.is_file()]; [shutil.rmtree(r, ignore_errors=True) for r in (h / "sigma-releases").iterdir() if r.is_dir() and (a is None or r.resolve() != a.resolve())]'\'' && df -h /home/sigma-elms'
      - name: Upload release archive
        shell: bash
        run: |
          target="sigma-elms@ssh-sigma-elms.alwaysdata.net"
          archive="/home/sigma-elms/sigma-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          opts=(-i ~/.ssh/alwaysdata -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${opts[@]}" release.zip "$target:$archive"
      - name: Upload activation script
        shell: bash
        run: |
          target="sigma-elms@ssh-sigma-elms.alwaysdata.net"
          opts=(-i ~/.ssh/alwaysdata -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${opts[@]}" scripts/activate-hosting-release.py "$target:/home/sigma-elms/sigma-private/activate-hosting-release.py"
      - name: Activate release
        shell: bash
        run: |
          target="sigma-elms@ssh-sigma-elms.alwaysdata.net"
          archive="/home/sigma-elms/sigma-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          release="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          opts=(-i ~/.ssh/alwaysdata -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${opts[@]}" "$target" "python3 -u /home/sigma-elms/sigma-private/activate-hosting-release.py --archive '$archive' --release '$release'"
      - name: Deploy coursework documents and publish subjects
        shell: bash
        run: |
          target="sigma-elms@ssh-sigma-elms.alwaysdata.net"
          opts=(-i ~/.ssh/alwaysdata -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${opts[@]}" output/all-draft-coursework/coursework-documents.zip "$target:/home/sigma-elms/coursework-documents.zip"
          scp "${opts[@]}" output/all-draft-coursework/all-draft-coursework-bundle.json "$target:/home/sigma-elms/sigma-private/all-draft-coursework-bundle.json"
          scp "${opts[@]}" scripts/install-all-draft-coursework.php "$target:/home/sigma-elms/sigma-private/install-all-draft-coursework.php"
          ssh "${opts[@]}" "$target" 'python3 -c '\''import zipfile, pathlib; z = pathlib.Path("/home/sigma-elms/coursework-documents.zip"); d = pathlib.Path("/home/sigma-elms/sigma-private/announcement-uploads/documents"); d.mkdir(parents=True, exist_ok=True); zipfile.ZipFile(z).extractall(d); z.unlink(); print("Extracted coursework files to", d)'\'''
          ssh "${opts[@]}" "$target" "php /home/sigma-elms/sigma-private/install-all-draft-coursework.php /home/sigma-elms/www /home/sigma-elms/sigma-private/all-draft-coursework-bundle.json 0000000"
      - name: Check public login
        run: curl --fail --silent --show-error --location --max-time 30 https://sigma-elms.alwaysdata.net/index.html --output /dev/null
      - name: Remove runner deployment key
        if: always()
        run: rm -f ~/.ssh/alwaysdata

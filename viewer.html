        async function renderText(arrayBuffer) {
            const canvas = document.getElementById('paper-canvas');
            const contentArea = document.getElementById('doc-content-area');
            const sheet = document.getElementById('document-sheet');
            const loading = document.getElementById('loading-overlay');
            const pptxWorkspace = document.getElementById('pptx-workspace');
            const errState = document.getElementById('error-state');

            if (errState) errState.classList.add('hidden');
            pptxWorkspace.classList.remove('active');
            sheet.style.display = 'block';

            let textContent = '';
            try {
                const decoder = new TextDecoder('utf-8', { fatal: false });
                textContent = decoder.decode(arrayBuffer);
            } catch (e) {
                const decoder = new TextDecoder('iso-8859-1');
                textContent = decoder.decode(arrayBuffer);
            }

            const escaped = textContent.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            contentArea.innerHTML = `<pre class="font-mono text-sm text-slate-800 leading-relaxed whitespace-pre-wrap select-text p-4 sm:p-8">${escaped}</pre>`;

            loading.classList.add('hidden');
            canvas.classList.add('active');
            updateZoom();
        }

        async function renderDocx(arrayBuffer) {
            const canvas = document.getElementById('paper-canvas');
            const sheet = document.getElementById('document-sheet');
            const loading = document.getElementById('loading-overlay');
            const pptxWorkspace = document.getElementById('pptx-workspace');
            const errState = document.getElementById('error-state');

            if (errState) errState.classList.add('hidden');
            pptxWorkspace.classList.remove('active');

            let rendered = false;

            // 1. First Attempt: docx-preview (Full page fidelity with images)
            if (window.docx && window.docx.renderAsync) {
                try {
                    sheet.style.display = 'none';
                    const wrapper = document.getElementById('paper-wrapper');
                    wrapper.innerHTML = '<div id="document-sheet" class="paper-sheet"><div id="doc-content-area" class="doc-content"></div></div>';
                    await window.docx.renderAsync(arrayBuffer, wrapper, null, {
                        className: 'docx',
                        inWrapper: true,
                        breakPages: true,
                        useBase64URL: true,
                        ignoreWidth: false,
                        ignoreHeight: false
                    });
                    rendered = true;
                } catch (e) {
                    console.warn('docx-preview notice, falling back to Mammoth:', e);
                }
            }

            // 2. Second Attempt: Mammoth.js with Full Image Conversion
            if (!rendered && window.mammoth) {
                try {
                    const wrapper = document.getElementById('paper-wrapper');
                    if (wrapper) {
                        wrapper.innerHTML = '<div id="document-sheet" class="paper-sheet" style="display:block;"><div id="doc-content-area" class="doc-content"></div></div>';
                    }
                    const targetContentArea = document.getElementById('doc-content-area') || document.getElementById('paper-wrapper');
                    
                    const mammothOptions = {
                        convertImage: window.mammoth.images ? window.mammoth.images.imgElement(function (image) {
                            return image.read('base64').then(function (imageBuffer) {
                                return {
                                    src: 'data:' + image.contentType + ';base64,' + imageBuffer
                                };
                            });
                        }) : undefined
                    };

                    const result = await window.mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, mammothOptions);
                    if (targetContentArea && result.value && result.value.trim()) {
                        targetContentArea.innerHTML = `<div class="font-['Inter'] space-y-4 p-6 sm:p-10 leading-relaxed text-slate-900">${result.value}</div>`;
                        rendered = true;
                    }
                } catch (mErr) {
                    console.warn('Mammoth notice, falling back to OOXML parser:', mErr);
                }
            }

            // 3. Third Attempt: Direct OOXML JSZip Document Parser (Extracts Paragraphs, Images, Tables)
            if (!rendered && window.JSZip) {
                try {
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    
                    // Extract all embedded media images
                    const mediaMap = {};
                    for (const path of Object.keys(zip.files)) {
                        if (path.startsWith('word/media/')) {
                            const blob = await zip.files[path].async('blob');
                            mediaMap[path] = URL.createObjectURL(blob);
                            mediaMap[path.replace('word/', '')] = mediaMap[path];
                            mediaMap[path.split('/').pop()] = mediaMap[path];
                        }
                    }

                    // Extract relationship mappings
                    const relsMap = {};
                    const relsFile = zip.files['word/_rels/document.xml.rels'];
                    if (relsFile) {
                        const relsXmlStr = await relsFile.async('string');
                        const relsParser = new DOMParser();
                        const relsDoc = relsParser.parseFromString(relsXmlStr, 'application/xml');
                        const relNodes = relsDoc.getElementsByTagName('Relationship');
                        for (let r = 0; r < relNodes.length; r++) {
                            const rId = relNodes[r].getAttribute('Id');
                            const target = relNodes[r].getAttribute('Target');
                            if (rId && target) {
                                const cleanTarget = target.replace('../', '').replace('media/', '');
                                relsMap[rId] = mediaMap[target] || mediaMap['media/' + cleanTarget] || mediaMap[cleanTarget];
                            }
                        }
                    }

                    const docXmlFile = zip.files['word/document.xml'];
                    if (docXmlFile) {
                        const xmlText = await docXmlFile.async('string');
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, 'application/xml');

                        const bodyNode = xmlDoc.getElementsByTagName('w:body')[0] || xmlDoc.documentElement;
                        let htmlOutput = '';

                        // Traverse body child nodes (paragraphs, tables, drawings)
                        const childNodes = bodyNode.children || bodyNode.childNodes;
                        for (let i = 0; i < childNodes.length; i++) {
                            const node = childNodes[i];
                            const nodeName = node.nodeName || '';

                            if (nodeName.endsWith(':p') || nodeName === 'p') {
                                // Extract Paragraph
                                let pText = '';
                                const tNodes = node.getElementsByTagName('w:t');
                                for (let t = 0; t < tNodes.length; t++) {
                                    pText += tNodes[t].textContent;
                                }

                                // Check for inline images inside paragraph
                                let imageHtml = '';
                                const blipNodes = node.getElementsByTagName('a:blip');
                                for (let b = 0; b < blipNodes.length; b++) {
                                    const rEmbed = blipNodes[b].getAttribute('r:embed') || blipNodes[b].getAttribute('embed');
                                    if (rEmbed && relsMap[rEmbed]) {
                                        imageHtml += `<div class="my-4 text-center"><img src="${relsMap[rEmbed]}" alt="Document Graphic" class="max-w-full h-auto mx-auto rounded-xl shadow-md border border-slate-200" /></div>`;
                                    }
                                }

                                const vImages = node.getElementsByTagName('v:imagedata');
                                for (let vi = 0; vi < vImages.length; vi++) {
                                    const rId = vImages[vi].getAttribute('r:id') || vImages[vi].getAttribute('id');
                                    if (rId && relsMap[rId]) {
                                        imageHtml += `<div class="my-4 text-center"><img src="${relsMap[rId]}" alt="Document Graphic" class="max-w-full h-auto mx-auto rounded-xl shadow-md border border-slate-200" /></div>`;
                                    }
                                }

                                pText = pText.trim();
                                if (pText) {
                                    htmlOutput += `<p class="mb-3 leading-relaxed text-slate-800 font-['Inter']">${escapeHtml(pText)}</p>`;
                                }
                                if (imageHtml) {
                                    htmlOutput += imageHtml;
                                }
                            } else if (nodeName.endsWith(':tbl') || nodeName === 'tbl') {
                                // Extract Table
                                const trNodes = node.getElementsByTagName('w:tr');
                                if (trNodes.length > 0) {
                                    let tableHtml = '<table class="w-full border border-slate-300 my-4 text-sm text-slate-800 border-collapse">';
                                    for (let r = 0; r < trNodes.length; r++) {
                                        tableHtml += '<tr>';
                                        const tcNodes = trNodes[r].getElementsByTagName('w:tc');
                                        for (let c = 0; c < tcNodes.length; c++) {
                                            const cellTexts = tcNodes[c].getElementsByTagName('w:t');
                                            let cellStr = '';
                                            for (let ct = 0; ct < cellTexts.length; ct++) cellStr += cellTexts[ct].textContent;
                                            const tag = r === 0 ? 'th' : 'td';
                                            tableHtml += `<${tag} class="border border-slate-300 p-2 sm:p-3 ${r === 0 ? 'bg-slate-100 font-bold' : ''}">${escapeHtml(cellStr.trim())}</${tag}>`;
                                        }
                                        tableHtml += '</tr>';
                                    }
                                    tableHtml += '</table>';
                                    htmlOutput += tableHtml;
                                }
                            }
                        }

                        if (htmlOutput.trim()) {
                            const wrapper = document.getElementById('paper-wrapper');
                            if (wrapper) {
                                wrapper.innerHTML = '<div id="document-sheet" class="paper-sheet" style="display:block;"><div id="doc-content-area" class="doc-content"></div></div>';
                            }
                            const target = document.getElementById('doc-content-area') || document.getElementById('paper-wrapper');
                            if (target) {
                                target.innerHTML = `<div class="font-['Inter'] space-y-3 p-6 sm:p-10">${htmlOutput}</div>`;
                                rendered = true;
                            }
                        }
                    }
                } catch (zipErr) {
                    console.warn('JSZip DOCX fallback notice:', zipErr);
                }
            }

            if (rendered) {
                loading.classList.add('hidden');
                canvas.classList.add('active');
                updateZoom();
            } else {
                showError('Unable to parse Word document formatting.');
            }
        }

        // --- PPTX SLIDE PRESENTATION PARSER & 1-BY-1 SLIDE RENDERER ---
        async function renderPptx(arrayBuffer, fileName, source) {
            const pptxWorkspace = document.getElementById('pptx-workspace');
            const paperCanvas = document.getElementById('paper-canvas');
            const loading = document.getElementById('loading-overlay');
            const errState = document.getElementById('error-state');

            if (errState) errState.classList.add('hidden');
            paperCanvas.classList.remove('active');

            try {
                const zip = await JSZip.loadAsync(arrayBuffer);
                
                // Extract all slide XML files
                const slideFiles = Object.keys(zip.files).filter(k => k.match(/^ppt\/slides\/slide\d+\.xml$/i));
                
                if (slideFiles.length === 0) {
                    throw new Error('No slides found in presentation archive.');
                }

                // Sort slide files numerically (slide1, slide2, slide3... slide27)
                slideFiles.sort((a, b) => {
                    const numA = parseInt(a.match(/slide(\d+)\.xml/i)?.[1] || 0, 10);
                    const numB = parseInt(b.match(/slide(\d+)\.xml/i)?.[1] || 0, 10);
                    return numA - numB;
                });

                // Extract all media images
                const mediaMap = {};
                for (const path of Object.keys(zip.files)) {
                    if (path.startsWith('ppt/media/')) {
                        const blob = await zip.files[path].async('blob');
                        mediaMap[path.replace('ppt/', '')] = URL.createObjectURL(blob);
                    }
                }

                // Parse each slide XML
                pptxSlides = [];
                const parser = new DOMParser();

                for (let i = 0; i < slideFiles.length; i++) {
                    const slidePath = slideFiles[i];
                    const xmlStr = await zip.files[slidePath].async('string');
                    const xmlDoc = parser.parseFromString(xmlStr, 'application/xml');

                    // Read relationships for slide pictures
                    const relsPath = slidePath.replace('ppt/slides/', 'ppt/slides/_rels/') + '.rels';
                    const slideRels = {};
                    if (zip.files[relsPath]) {
                        const relsXmlStr = await zip.files[relsPath].async('string');
                        const relsDoc = parser.parseFromString(relsXmlStr, 'application/xml');
                        const relNodes = relsDoc.getElementsByTagName('Relationship');
                        for (let r = 0; r < relNodes.length; r++) {
                            const rId = relNodes[r].getAttribute('Id');
                            const target = relNodes[r].getAttribute('Target')?.replace('../', '');
                            if (rId && target) slideRels[rId] = target;
                        }
                    }

                    // Extract Title & Paragraphs
                    const spNodes = xmlDoc.getElementsByTagName('p:sp');
                    let slideTitle = '';
                    const paragraphs = [];
                    const slideImages = [];

                    for (let s = 0; s < spNodes.length; s++) {
                        const sp = spNodes[s];
                        const ph = sp.querySelector('p\\:ph, ph');
                        const phType = ph ? ph.getAttribute('type') : '';

                        const textNodes = sp.getElementsByTagName('a:t');
                        let textContent = '';
                        for (let t = 0; t < textNodes.length; t++) {
                            textContent += textNodes[t].textContent;
                        }
                        textContent = textContent.trim();

                        if (textContent) {
                            if ((phType === 'title' || phType === 'ctrTitle' || (!slideTitle && s === 0)) && textContent.length < 120) {
                                if (!slideTitle) slideTitle = textContent;
                                else paragraphs.push(textContent);
                            } else {
                                paragraphs.push(textContent);
                            }
                        }
                    }

                    // Extract Pictures
                    const picNodes = xmlDoc.getElementsByTagName('p:pic');
                    for (let p = 0; p < picNodes.length; p++) {
                        const blip = picNodes[p].querySelector('a\\:blip, blip');
                        const embedId = blip?.getAttribute('r:embed') || blip?.getAttribute('embed');
                        if (embedId && slideRels[embedId] && mediaMap[slideRels[embedId]]) {
                            slideImages.push(mediaMap[slideRels[embedId]]);
                        }
                    }

                    pptxSlides.push({
                        number: i + 1,
                        title: slideTitle || (slideImages.length > 0 ? '' : `Slide ${i + 1}`),
                        paragraphs: paragraphs,
                        images: slideImages
                    });
                }

                // Render Left Sidebar Thumbnails & 1-by-1 Slide Stage
                document.getElementById('slide-count-badge').textContent = pptxSlides.length;
                document.getElementById('indicator-total').textContent = pptxSlides.length;
                renderThumbnailsList();
                currentSlideIdx = 0;
                displayCurrentSlide(false);
                setupMainScrollbar();

                loading.classList.add('hidden');
                pptxWorkspace.classList.add('active');
                updateZoom();

            } catch (err) {
                console.warn('PPTX parsing error:', err);
                showError('Unable to load PowerPoint slides.');
            }
        }

        function renderThumbnailsList() {
            const list = document.getElementById('slides-thumbnail-list');
            if (!list) return;

            list.innerHTML = pptxSlides.map((slide, idx) => `
                <div class="slide-thumb-item ${idx === 0 ? 'active' : ''}" onclick="window.selectSlide(${idx})" id="thumb-item-${idx}">
                    <span class="slide-thumb-num">${slide.number}</span>
                    <div class="slide-thumb-card">
                        ${slide.images.length > 0
                            ? `<img src="${slide.images[0]}" alt="Slide ${slide.number}" class="w-full h-full object-cover">`
                            : `<div class="p-2 text-center"><p class="text-[9px] font-bold text-slate-700 dark:text-slate-300 line-clamp-2">${escapeHtml(slide.title || `Slide ${slide.number}`)}</p></div>`
                        }
                    </div>
                </div>
            `).join('');
        }

        function showSlideIndicatorBadge() {
            const badge = document.getElementById('slide-indicator-badge');
            if (!badge || pptxSlides.length === 0) return;

            const indCurrent = document.getElementById('indicator-current');
            const indTotal = document.getElementById('indicator-total');
            if (indCurrent) indCurrent.textContent = currentSlideIdx + 1;
            if (indTotal) indTotal.textContent = pptxSlides.length;

            badge.classList.add('visible');

            if (badgeFadeTimeout) clearTimeout(badgeFadeTimeout);
            badgeFadeTimeout = setTimeout(() => {
                badge.classList.remove('visible');
            }, 1400);
        }

        function displayCurrentSlide(syncScroll = true, showBadge = false) {
            const container = document.getElementById('main-slide-container');
            const stepper = document.getElementById('slide-stepper-label');
            if (!container || pptxSlides.length === 0) return;

            const slide = pptxSlides[currentSlideIdx];
            if (stepper) stepper.textContent = `${slide.number} / ${pptxSlides.length}`;

            // Update active state in left sidebar
            document.querySelectorAll('.slide-thumb-item').forEach((el, i) => {
                if (i === currentSlideIdx) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });

            const bulletsHtml = slide.paragraphs.map(p => `
                <div class="slide-canvas-bullet">
                    <div class="slide-canvas-bullet-dot"></div>
                    <p class="leading-relaxed font-normal">${escapeHtml(p)}</p>
                </div>
            `).join('');

            const imagesHtml = slide.images.map(img => `
                <img src="${img}" alt="Slide Image" class="slide-canvas-img shadow-xs">
            `).join('');

            const titleHeaderHtml = slide.title ? `
                <div class="slide-canvas-title">
                    <h2>${escapeHtml(slide.title)}</h2>
                </div>
            ` : '';

            const isImageOnlySlide = slide.images.length > 0 && slide.paragraphs.length === 0;

            if (isImageOnlySlide) {
                container.className = 'slide-canvas is-image-slide';
                container.innerHTML = `
                    ${slide.title ? `<div class="p-6 w-full">${titleHeaderHtml}</div>` : ''}
                    <img src="${slide.images[0]}" alt="Slide ${slide.number}" class="slide-canvas-img">
                `;
            } else {
                container.className = 'slide-canvas';
                container.innerHTML = `
                    ${titleHeaderHtml}
                    <div class="slide-canvas-body">
                        ${bulletsHtml}
                        ${imagesHtml}
                        ${!bulletsHtml && !imagesHtml ? '<p class="text-slate-400 italic">Empty slide</p>' : ''}
                    </div>
                `;
            }

            if (syncScroll) {
                syncStageScroll(currentSlideIdx);
            }

            if (showBadge) {
                showSlideIndicatorBadge();
            }
        }

        // Native Main Scrollbar Synchronization
        function setupMainScrollbar() {
            const stageArea = document.getElementById('pptx-stage-area');
            const spacer = document.getElementById('pptx-scroll-spacer');
            if (!stageArea || !spacer) return;

            spacer.style.height = `${Math.max(2, pptxSlides.length) * 350}px`;

            let isScrolling = false;
            let scrollDebounce = null;

            stageArea.addEventListener('scroll', () => {
                showSlideIndicatorBadge();

                if (isProgrammaticScroll || pptxSlides.length <= 1) return;

                if (scrollDebounce) clearTimeout(scrollDebounce);
                scrollDebounce = setTimeout(() => {
                    const maxScroll = stageArea.scrollHeight - stageArea.clientHeight;
                    if (maxScroll <= 0) return;
                    const fraction = Math.min(1, Math.max(0, stageArea.scrollTop / maxScroll));
                    const targetIdx = Math.min(pptxSlides.length - 1, Math.max(0, Math.round(fraction * (pptxSlides.length - 1))));
                    
                    if (targetIdx !== currentSlideIdx) {
                        currentSlideIdx = targetIdx;
                        displayCurrentSlide(false, true);
                    }
                }, 30);
            }, { passive: true });

            // Wheel event steps exactly 1-by-1
            stageArea.addEventListener('wheel', (e) => {
                e.preventDefault();
                showSlideIndicatorBadge();
                if (wheelDebounceTimeout) return;

                if (e.deltaY > 15) {
                    window.nextSlide();
                    wheelDebounceTimeout = setTimeout(() => { wheelDebounceTimeout = null; }, 220);
                } else if (e.deltaY < -15) {
                    window.prevSlide();
                    wheelDebounceTimeout = setTimeout(() => { wheelDebounceTimeout = null; }, 220);
                }
            }, { passive: false });
        }

        function syncStageScroll(idx) {
            const stageArea = document.getElementById('pptx-stage-area');
            if (!stageArea || pptxSlides.length <= 1) return;
            const maxScroll = stageArea.scrollHeight - stageArea.clientHeight;
            if (maxScroll > 0) {
                isProgrammaticScroll = true;
                stageArea.scrollTop = (idx / (pptxSlides.length - 1)) * maxScroll;
                setTimeout(() => { isProgrammaticScroll = false; }, 80);
            }
        }

        window.selectSlide = function (idx) {
            if (idx >= 0 && idx < pptxSlides.length) {
                currentSlideIdx = idx;
                displayCurrentSlide(true, true);
            }
        };

        window.prevSlide = function () {
            if (isSlideShowActive) {
                if (isShowingSlideShowEnd) {
                    isShowingSlideShowEnd = false;
                    updateSlideShowModal();
                    return;
                }
                if (currentSlideIdx > 0) {
                    currentSlideIdx--;
                    displayCurrentSlide(true, false);
                    updateSlideShowModal();
                }
                return;
            }
            if (currentSlideIdx > 0) {
                currentSlideIdx--;
                displayCurrentSlide(true, true);
            }
        };

        window.nextSlide = function () {
            if (isSlideShowActive) {
                if (isShowingSlideShowEnd) {
                    window.exitSlideShow();
                    return;
                }
                if (currentSlideIdx < pptxSlides.length - 1) {
                    currentSlideIdx++;
                    displayCurrentSlide(true, false);
                    updateSlideShowModal();
                } else {
                    showSlideShowEndScreen();
                }
                return;
            }
            if (currentSlideIdx < pptxSlides.length - 1) {
                currentSlideIdx++;
                displayCurrentSlide(true, true);
            }
        };

        // --- FULLSCREEN PRESENTATION MODE (SLIDE SHOW) ---
        window.startSlideShow = function () {
            const modal = document.getElementById('slideshow-modal');
            if (!modal) return;
            isSlideShowActive = true;
            isShowingSlideShowEnd = false;
            modal.classList.add('active');
            updateSlideShowModal();

            if (modal.requestFullscreen) {
                modal.requestFullscreen().catch(() => {
                    document.documentElement.requestFullscreen().catch(() => {});
                });
            } else if (modal.webkitRequestFullscreen) {
                modal.webkitRequestFullscreen();
            } else if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        };

        window.exitSlideShow = function () {
            const modal = document.getElementById('slideshow-modal');
            if (modal) modal.classList.remove('active');
            isSlideShowActive = false;
            isShowingSlideShowEnd = false;
            if (slideShowAutoExitTimer) clearTimeout(slideShowAutoExitTimer);
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
        };

        function showSlideShowEndScreen() {
            isShowingSlideShowEnd = true;
            if (slideShowAutoExitTimer) clearTimeout(slideShowAutoExitTimer);

            const container = document.getElementById('slideshow-container');
            if (!container) return;

            container.innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-center text-center p-8 bg-black select-none cursor-pointer" onclick="window.nextSlide()">
                    <div class="w-14 h-14 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-white/70 text-2xl mb-4 shadow-lg">
                        <i class="fa-solid fa-person-chalkboard"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-300">Click anywhere or press Next to exit.</p>
                </div>
            `;
        }

        function updateSlideShowModal() {
            const container = document.getElementById('slideshow-container');
            if (!container || pptxSlides.length === 0) return;

            const slide = pptxSlides[currentSlideIdx];

            const bulletsHtml = slide.paragraphs.map(p => `
                <div class="slide-canvas-bullet">
                    <div class="slide-canvas-bullet-dot"></div>
                    <p class="leading-relaxed font-normal">${escapeHtml(p)}</p>
                </div>
            `).join('');

            const imagesHtml = slide.images.map(img => `
                <img src="${img}" alt="Slide Image" class="slide-canvas-img shadow-xs">
            `).join('');

            const titleHeaderHtml = slide.title ? `
                <div class="slide-canvas-title">
                    <h2>${escapeHtml(slide.title)}</h2>
                </div>
            ` : '';

            const isImageOnlySlide = slide.images.length > 0 && slide.paragraphs.length === 0;

            if (isImageOnlySlide) {
                container.innerHTML = `
                    <div class="slide-canvas is-image-slide bg-black" onclick="event.stopPropagation(); window.nextSlide();">
                        <img src="${slide.images[0]}" alt="Slide ${slide.number}" class="slide-canvas-img">
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="slide-canvas bg-white text-slate-800" onclick="event.stopPropagation(); window.nextSlide();">
                        ${titleHeaderHtml}
                        <div class="slide-canvas-body">
                            ${bulletsHtml}
                            ${imagesHtml}
                        </div>
                    </div>
                `;
            }
        }

        // --- HIGH-FIDELITY PRINT SYSTEM ---
        window.printDocument = function () {
            if (currentFileType === 'pptx') {
                const printArea = document.getElementById('print-area');
                if (printArea && pptxSlides.length > 0) {
                    printArea.innerHTML = pptxSlides.map((slide) => {
                        if (slide.images.length > 0 && slide.paragraphs.length === 0) {
                            return `
                                <div class="print-slide-page">
                                    <img src="${slide.images[0]}" class="print-slide-img" />
                                </div>
                            `;
                        } else {
                            return `
                                <div class="print-slide-page">
                                    <div class="print-slide-content">
                                        ${slide.title ? `<h2 class="slide-canvas-title">${escapeHtml(slide.title)}</h2>` : ''}
                                        <div class="slide-canvas-body">
                                            ${slide.paragraphs.map(p => `<div class="slide-canvas-bullet"><div class="slide-canvas-bullet-dot"></div><p class="leading-relaxed font-normal">${escapeHtml(p)}</p></div>`).join('')}
                                            ${slide.images.map(img => `<img src="${img}" class="slide-canvas-img" />`).join('')}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }).join('');
                }
            }

            requestAnimationFrame(() => {
                setTimeout(() => {
                    window.print();
                }, 50);
            });
        };

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showError(msg) {
            document.getElementById('loading-overlay').classList.add('hidden');
            document.getElementById('error-msg').textContent = msg;
            document.getElementById('error-state').classList.remove('hidden');

            const sizeLabel = document.getElementById('doc-size-label');
            if (sizeLabel) sizeLabel.textContent = 'Preview Unavailable';

            // Disable / lock all viewing tools
            const centerControls = document.getElementById('center-toolbar-controls');
            if (centerControls) {
                centerControls.classList.add('opacity-40', 'pointer-events-none', 'cursor-not-allowed');
            }

            const buttonsToDisable = ['sidebar-toggle-btn', 'pptx-slideshow-btn', 'fullscreen-btn', 'print-btn'];
            buttonsToDisable.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.classList.add('opacity-40', 'pointer-events-none', 'cursor-not-allowed');
                    btn.setAttribute('disabled', 'true');
                }
            });

            // Set direct download link in error card
            const errDl = document.getElementById('error-download-btn');
            const mainDl = document.getElementById('download-btn');
            if (errDl && mainDl) {
                errDl.href = mainDl.href;
                errDl.download = mainDl.download;
            }
        }

        window.addEventListener('DOMContentLoaded', loadDocument);
    </script>
